[project]
name = "pakkacover"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115", "uvicorn[standard]>=0.34", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30",
 "alembic>=1.15", "cryptography>=44", "httpx>=0.28", "python-multipart>=0.0.20",
 "python-dotenv>=1", "pydantic-settings>=2", "pypdf>=5", "reportlab>=4", "pillow>=11",
 "anthropic>=0.49", "openai>=1.66", "rapidfuzz>=3", "python-dateutil>=2.9",
 "paytmchecksum==1.7.0", "pycryptodome==3.23.0", "python-ulid>=3"
]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "hypothesis>=6", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
